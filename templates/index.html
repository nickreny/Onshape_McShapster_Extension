<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onshape McMaster Assembler</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Onshape McMaster Assembler</h1>
  <p class="sub">RM tool — turns messy multi-body McMaster imports into a single grouped rigid assembly.</p>

  <section>
    <label>Document URL</label>
    <input id="docUrl" type="text" placeholder="https://cad.onshape.com/documents/.../w/.../e/...">
    <button id="loadBtn">Load Part Studios</button>
  </section>

  <section id="studiosSection" hidden>
    <label>McMaster STEP files (from your downloads folder)</label>
    <input id="stepFiles" type="file" accept=".step,.stp" multiple>
    <p class="hint">Each file becomes its own assembly, with all its bodies grouped into one rigid unit and named after the file. Nothing gets merged together across different parts.</p>

    <label>Existing messy multi-body Part Studios already in this document (optional)</label>
    <div id="studioList"></div>

    <label class="checkbox-row">
      <input id="deleteOriginals" type="checkbox" checked>
      Delete the original messy multi-body Part Studios afterward
    </label>

    <button id="mergeBtn">Assemble &amp; Group</button>
  </section>

  <section>
    <label>Log</label>
    <pre id="log"></pre>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
